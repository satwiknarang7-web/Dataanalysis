[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "insight"
version = "2.0.0"
description = "Drop in a spreadsheet, get the dashboard an analyst would build: cleaned data, headline numbers, and tested findings in plain English."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "cachetools>=5.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "duckdb>=1.0",
    "httpx>=0.27",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
# Running a long-lived server (Docker, local). Vercel brings its own, so it is not a core dependency.
server = ["uvicorn[standard]>=0.30"]
dev = ["insight[server]", "pytest>=8", "pytest-asyncio>=0.23", "aiosqlite>=0.20", "ruff>=0.5", "scipy>=1.13"]

[project.scripts]
insight = "insight.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/insight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 140
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003", "E731", "SIM108"]
