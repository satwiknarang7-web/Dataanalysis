# Applies database migrations to Neon when they land on main.
# Vercel deploys the app from the same push; keep migrations additive
# (add columns and tables first, remove them in a later release) so the
# running version and the new one both work while the deploy rolls out.
name: Migrate
on:
  push:
    branches: [main]
    paths: ["migrations/**", "src/insight/db/**"]
  workflow_dispatch:

concurrency: { group: migrate, cancel-in-progress: false }

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - name: alembic upgrade head
        run: alembic upgrade head
        env:
          # Neon's direct (non-pooled) connection string, stored as a repository secret.
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
