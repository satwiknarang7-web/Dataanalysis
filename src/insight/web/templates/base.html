<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Insight{% endblock %}</title>
  <meta name="description" content="Drop in a spreadsheet and get the dashboard an analyst would build: headline numbers, trends, and findings in plain English.">
  <meta name="color-scheme" content="light dark">
  <script src="/static/js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/static/css/app.css?v=1">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <script src="/static/vendor/htmx-2.0.4.min.js" defer></script>
  {% block head %}{% endblock %}
  <script src="/static/js/app.js?v=1" defer></script>
</head>
<body hx-headers='{"X-Requested-With": "htmx"}'>
  <div class="loading-bar" id="loading-bar"></div>
  {% block body %}{% endblock %}
  <div class="toast-zone" id="toasts" aria-live="polite"></div>
</body>
</html>
