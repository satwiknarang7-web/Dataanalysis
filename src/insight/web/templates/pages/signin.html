{% extends "layouts/auth.html" %}
{% import "macros.html" as ui %}
{% block title %}Sign in · Insight{% endblock %}
{% block form %}
<div><h1>Welcome back</h1><p class="muted" style="margin-top:6px">Sign in to your dashboards.</p></div>
{% if error %}<div class="alert error">{{ error }}</div>{% endif %}
<form class="stack" style="--gap:16px" method="post" action="/signin" data-busy-form>
  <input type="hidden" name="next" value="{{ next }}">
  <div class="field"><label for="email">Work email</label><input class="input" id="email" name="email" type="email" autocomplete="email" value="{{ email }}" required autofocus></div>
  <div class="field"><label for="password">Password</label><input class="input" id="password" name="password" type="password" autocomplete="current-password" required></div>
  <button class="btn primary lg block">Sign in</button>
</form>
<p class="muted small">New to Insight? <a href="/signup?next={{ next | urlencode }}">Create a free account</a></p>
{% endblock %}
